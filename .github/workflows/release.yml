name: Release

# 发布闸门（实测后再发布）：
# 推送 v*.*.* 标签只做版本标记，不触发任何构建或发布。
# 只有人工在 Actions 页面手动运行本工作流、并填入已实测通过的标签名时，
# 才会构建三平台产物并创建 GitHub Release，避免把未实测的版本公开发布。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已实测、要发布的版本标签（例如 v1.1.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    # 双保险：即使将来误加 push 触发器，也不会自动构建。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 暂不发布：只有 Windows x64 维护环境，fork 仓库上 macOS runner
        # 会被平台侧直接取消。需要时可从源码本地构建（package:mac:*）。
        include:
          - label: Windows x64
            os: windows-latest
            command: package:win:x64
            artifact: windows-x64
            files: dist/*.exe
          - label: Linux x64
            os: ubuntu-latest
            command: package:linux:x64
            artifact: linux-x64
            files: dist/*.AppImage

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify types
        run: pnpm typecheck
      - name: Prepare macOS release (optional signing)
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          RELEASE_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          RELEASE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          RELEASE_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          RELEASE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # 如果配置了签名证书和公证凭证，则启用签名+公证；
          # 否则跳过，产出未签名 DMG（用户首次运行需手动允许）。
          if [[ -z "$RELEASE_MAC_CSC_LINK" || -z "$RELEASE_MAC_CSC_KEY_PASSWORD" ]]; then
            echo "::warning::No macOS signing credentials found. Building unsigned DMG."
            echo "SIGNED_MAC=false" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ -z "$RELEASE_APPLE_API_KEY" || -z "$RELEASE_APPLE_API_KEY_ID" || -z "$RELEASE_APPLE_API_ISSUER" ]]; then
            echo "::warning::No Apple notarization credentials found. Building signed but un-notarized DMG."
            echo "SIGNED_MAC=false" >> "$GITHUB_ENV"
            exit 0
          fi

          key_path="$RUNNER_TEMP/AuthKey_${RELEASE_APPLE_API_KEY_ID}.p8"
          printf '%s' "$RELEASE_APPLE_API_KEY" > "$key_path"
          chmod 600 "$key_path"

          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$RELEASE_APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$RELEASE_APPLE_API_ISSUER"
            echo "SIGNED_MAC=true" >> "$GITHUB_ENV"
          } >> "$GITHUB_ENV"
      - name: Package application
        shell: bash
        run: |
          if [[ -n "$RELEASE_MAC_CSC_LINK" ]]; then
            export CSC_LINK="$RELEASE_MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$RELEASE_MAC_CSC_KEY_PASSWORD"
          fi

          if [[ -n "$RELEASE_WIN_CSC_LINK" ]]; then
            export WIN_CSC_LINK="$RELEASE_WIN_CSC_LINK"
            export WIN_CSC_KEY_PASSWORD="$RELEASE_WIN_CSC_KEY_PASSWORD"
          fi

          pnpm ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          RELEASE_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          RELEASE_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          RELEASE_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          RELEASE_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    # 闸门核心：publish 只在人工 dispatch 时运行。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag exists before publishing
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags --force
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          echo "Publishing pre-verified tag: $TAG"
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/* --clobber
          else
            gh release create "$TAG" release-artifacts/* --title "FloatPane $TAG" --generate-notes
          fi

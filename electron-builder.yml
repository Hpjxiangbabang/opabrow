appId: com.floatpane.app
productName: FloatPane
copyright: Copyright © 2026 FloatPane contributors
directories:
  buildResources: build
  output: dist
files:
  # 内部文档只保留在本地 docs/，绝不随安装包分发（app.asar）。
  - '!docs/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - build/**
win:
  target: nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # 不强制签名，允许产出未签名 DMG（用户首次运行需在系统设置中手动允许）
  forceCodeSigning: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 关闭公证，无 Apple Developer 证书时跳过
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 FloatPane contributors.
    LSApplicationCategoryType: public.app-category.utilities
    CFBundleURLTypes:
      - CFBundleURLName: floatpane.url
        CFBundleURLSchemes:
          - floatpane
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: true
  entitlements: build/entitlements.direct.plist
  entitlementsInherit: build/entitlements.direct.plist
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: AppImage
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
# Windows 安装向导：允许用户在安装过程中选择目标文件夹
nsis:
  oneClick: false
  perMachine: false
  # T-15：禁用非管理员提权重启，避免 $INSTDIR 丢失与「上一步」退出向导（v1.1.6 已实测通过）。
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FloatPane
  include: build/installer.nsh
publish: null

appId: com.floatpane.app
productName: FloatPane
copyright: Copyright © 2026 FloatPane contributors
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - build/**
win:
  target: nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # 不强制签名，允许产出未签名 DMG（用户首次运行需在系统设置中手动允许）
  forceCodeSigning: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 关闭公证，无 Apple Developer 证书时跳过
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 FloatPane contributors.
    LSApplicationCategoryType: public.app-category.utilities
    CFBundleURLTypes:
      - CFBundleURLName: floatpane.url
        CFBundleURLSchemes:
          - floatpane
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: true
  entitlements: build/entitlements.direct.plist
  entitlementsInherit: build/entitlements.direct.plist
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: AppImage
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
# Windows 安装向导：允许用户在安装过程中选择目标文件夹
nsis:
  oneClick: false
  perMachine: false
  # T-15 试验（v1.1.6）：官方一等配置。设为 false 后模板 multiUserUi.nsh 会在
  # 非管理员时禁用「为全部人安装」单选并标注 (must run as admin)，
  # 因此 InstallModeLeave 的 UAC_RunElevated + Quit 分支不会被触发，
  # 安装器不再跨进程重启，$INSTDIR 得以保留，「上一步」也不会导致向导退出。
  # 保留双模式页（以管理员运行时两个选项都可用），且无需自定义 NSIS 脚本。
  # 代价：普通用户若需全用户安装，须手动以管理员身份重新启动安装器。
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FloatPane
  include: build/installer.nsh
publish: null

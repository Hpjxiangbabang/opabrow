appId: com.opabrow.app
productName: opabrow
copyright: Copyright © 2026 opabrow contributors
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - build/**
win:
  target: nsis
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # 不强制签名，允许产出未签名 DMG（用户首次运行需在系统设置中手动允许）
  forceCodeSigning: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 关闭公证，无 Apple Developer 证书时跳过
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2026 opabrow contributors.
    LSApplicationCategoryType: public.app-category.utilities
    CFBundleURLTypes:
      - CFBundleURLName: opabrow.url
        CFBundleURLSchemes:
          - opabrow
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: true
  entitlements: build/entitlements.direct.plist
  entitlementsInherit: build/entitlements.direct.plist
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target: AppImage
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
publish: null
